[project]
name = "ascend-scheduling-api"
version = "0.1.0"
description = "Internal scheduling API (assessment sandbox)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
